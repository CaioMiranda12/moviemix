services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moviemix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moviemix_dev}
      POSTGRES_DB: moviemix
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moviemix -d moviemix"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: moviemix_test
      POSTGRES_PASSWORD: moviemix_test_local
      POSTGRES_DB: moviemix_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moviemix_test -d moviemix_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3333"
      DATABASE_URL: postgres://moviemix:${POSTGRES_PASSWORD:-moviemix_dev}@db:5432/moviemix
      NODE_ENV: development
    ports:
      - "127.0.0.1:3333:3333"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3333/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
