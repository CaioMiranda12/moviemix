# S1-13: API only. Create the PostgreSQL database separately (Neon Free).
# Do not add real credentials to this file.
services:
  - type: web
    name: moviemix-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w @moviemix/api
    startCommand: npm run start -w @moviemix/api
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TMDB_READ_ACCESS_TOKEN
        sync: false
